<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tab Matrix · 标签矩阵</title><link rel="stylesheet" href="style.css"></head>
<body>

<aside class="sidebar">
  <a class="brand" href="newtab.html"><span class="brand-symbol">▦</span><span>标签管家<small>Tab Matrix</small></span></a>
  <section class="metrics" aria-label="Chrome 资源占用"><div class="metrics-heading">Chrome 占用<button id="refresh-metrics" aria-label="刷新资源占用" title="刷新资源占用">↻</button></div><div class="metrics-values"><div><span>内存</span><strong id="chrome-memory">—</strong></div><div><span>CPU</span><strong id="chrome-cpu">—</strong></div></div><div id="metrics-state" role="status">正在连接…</div><div id="metrics-delta"></div></section>
  <label class="language-picker"><span>语言</span><select id="language" aria-label="语言"><option data-language-ui value="system">跟随系统</option><option value="zh-CN">简体中文</option><option value="en">English</option></select></label><p id="language-hint" data-language-ui class="language-hint"></p><span id="language-status" data-language-ui class="sr-only" role="status"></span><div class="nav-label category-label">分类云</div><nav id="title-categories"></nav>
</aside>
<main>
  <section class="workspace"><div class="workspace-heading"><div><h2 id="view-title">全部标签 <span id="result-count"></span></h2><p id="view-description">你的数字世界，尽在此处。</p></div><button id="dedupe" class="primary">⌁ 清理重复标签 <span id="dedupe-count">0</span></button></div>
  <div class="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索标题、网址或网页正文…" aria-label="搜索标题、网址或网页正文"><kbd>/</kbd></label><select id="window-filter" aria-label="筛选窗口"><option value="all">所有窗口</option></select><button id="layout" title="切换列表视图" aria-label="切换列表视图">☷</button></div>
  <div id="demo-banner" hidden>预览模式 · 当前展示示例标签。加载为 Chrome 扩展后，将显示你的真实标签。</div>
  <div id="inactive-controls" hidden><label>未访问时长 <select id="inactive-days" aria-label="未访问时长"><option value="1">至少 1 天</option><option value="7" selected>至少 7 天</option><option value="30">至少 30 天</option></select></label><span id="inactive-note"></span></div><div id="search-status" role="status" hidden><span id="search-status-text"></span><button id="rescan">重新搜索正文</button></div><div id="content"></div></section>
  <footer><span><i></i> <span id="status">本地运行 · 数据只留在你的浏览器</span></span><span>整理标签，专注当下。</span></footer>
</main>
<dialog id="confirm-dialog"><form method="dialog"><div class="eyebrow">整理重复页面</div><h2>清理重复标签</h2><p id="confirm-text"></p><p class="dialog-note">按完整网址匹配，仅处理 HTTP / HTTPS 页面。优先保留固定页、当前活动页，再保留最近使用的一页。关闭可能丢失未提交内容。</p><div id="duplicate-preview"></div><div class="dialog-actions"><button value="cancel">取消</button><button id="confirm-close" value="confirm" class="primary">确认清理</button></div></form></dialog>
<div id="toast" role="status" hidden></div>
<script type="module" src="i18n.js"></script>
<script type="module" src="app.js"></script>
</body></html>
